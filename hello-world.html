<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="A vibrant Hello World landing page." />
  <title>Hello, World!</title>
  <style>
    :root {
      --ink: #f8f7ff;
      --muted: #cbc9e8;
      --purple: #9c6bff;
      --pink: #ff6fb5;
      --cyan: #63e6ff;
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      overflow: hidden;
      color: var(--ink);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #0c0920;
    }

    .orb {
      position: absolute;
      width: 38vmax;
      height: 38vmax;
      border-radius: 50%;
      filter: blur(20px);
      opacity: .48;
      animation: drift 14s ease-in-out infinite alternate;
    }

    .orb.one { background: var(--purple); top: -19vmax; left: -13vmax; }
    .orb.two { background: var(--pink); right: -16vmax; bottom: -21vmax; animation-delay: -5s; }
    .orb.three { background: var(--cyan); width: 24vmax; height: 24vmax; right: 7%; top: 7%; animation-delay: -9s; }

    main {
      position: relative;
      width: min(90vw, 720px);
      padding: clamp(2rem, 7vw, 5rem);
      text-align: center;
      border: 1px solid rgba(255, 255, 255, .25);
      border-radius: 32px;
      background: rgba(18, 13, 47, .56);
      box-shadow: 0 24px 80px rgba(0, 0, 0, .38), inset 0 1px rgba(255, 255, 255, .13);
      backdrop-filter: blur(18px);
      animation: enter .8s cubic-bezier(.2, .8, .2, 1) both;
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: .55rem;
      margin: 0 0 1.3rem;
      color: var(--cyan);
      font-size: .78rem;
      font-weight: 800;
      letter-spacing: .16em;
      text-transform: uppercase;
    }

    .dot {
      width: .55rem;
      height: .55rem;
      border-radius: 50%;
      background: currentColor;
      box-shadow: 0 0 18px currentColor;
    }

    h1 {
      margin: 0;
      font-size: clamp(3.5rem, 11vw, 7.5rem);
      line-height: .92;
      letter-spacing: -.075em;
      background: linear-gradient(120deg, #fff 15%, var(--cyan) 43%, var(--pink) 72%, #fff 100%);
      background-size: 200% auto;
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      animation: shimmer 5s linear infinite;
    }

    p {
      max-width: 34rem;
      margin: 1.6rem auto 2.1rem;
      color: var(--muted);
      font-size: clamp(1rem, 2vw, 1.15rem);
      line-height: 1.65;
    }

    a {
      display: inline-block;
      padding: .9rem 1.35rem;
      color: #120c2d;
      font-weight: 800;
      text-decoration: none;
      border-radius: 999px;
      background: linear-gradient(100deg, var(--cyan), #d9c4ff 52%, var(--pink));
      box-shadow: 0 10px 28px rgba(99, 230, 255, .22);
      transition: transform .2s ease, box-shadow .2s ease;
    }

    a:hover { transform: translateY(-3px) scale(1.02); box-shadow: 0 16px 36px rgba(255, 111, 181, .32); }
    a:focus-visible { outline: 3px solid white; outline-offset: 4px; }

    @keyframes drift { to { transform: translate(8vmax, 7vmax) scale(1.13); } }
    @keyframes shimmer { to { background-position: 200% center; } }
    @keyframes enter { from { opacity: 0; transform: translateY(22px) scale(.96); } to { opacity: 1; transform: none; } }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; scroll-behavior: auto !important; }
    }
  </style>
</head>
<body>
  <div class="orb one"></div>
  <div class="orb two"></div>
  <div class="orb three"></div>

  <main>
    <div class="eyebrow"><span class="dot"></span> A fresh beginning</div>
    <h1>Hello, World!</h1>
    <p>One small greeting, endless possibilities. Your next great idea starts right here.</p>
    <a href="#hello" id="hello">Start exploring ✦</a>
  </main>
</body>
</html>
